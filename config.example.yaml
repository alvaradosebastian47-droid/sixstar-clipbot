# SIX STAR ClipBot — configuración
# Copia este archivo a config.yaml y llena las claves. config.yaml NUNCA se sube a GitHub.

timezone: America/Costa_Rica
quiet_hours: [23, 7]          # entre 23:00 y 07:00 no se publica (se puede producir para las 07:00)
interval_minutes: 10          # cada cuánto corre el radar
report_hour: 22               # a esta hora llega el reporte diario por Telegram
workdir: /opt/clipbot/work    # carpeta de trabajo (videos temporales)

game: "Grand Theft Auto VI"

radar:
  max_clip_age_hours: 6       # prioridad a clips de menos de 6 h
  hard_max_age_hours: 24
  min_velocity: {es: 120, en: 400}   # vistas por hora mínimas de un clip de Twitch, por idioma
  live_streams_per_lang: 3    # streams en vivo por idioma para picos de chat
  chat_peak_min_x: 3.0        # pico de chat ≥ 3× la mediana
  chat_window_min: 30         # minutos hacia atrás que se miran en cada corrida
  max_reuploads_seen: 5       # (reservado) descartar si ya hay muchas resubidas

live_capture:
  enabled: true               # Streamlink: graba en vivo los N streams más grandes (buffer de 15 min)
  streams: 4
  buffer_minutes: 15

judge:
  model: claude-sonnet-5-5    # modelo de Anthropic para filtrar y titular
  min_score: 6                # 0-10; debajo de esto no se publica

accounts:
  es:
    accent: [61, 240, 110]
    subs: false
    youtube: true
    tiktok: false             # true cuando Sebastian diga que TikTok va en automático
    instagram: false
    uploadpost_user: sixstar-es
    hashtags: "#gta6 #gta6español #fyp #viral"
    disclaimer: "Fan page. No afiliado con Rockstar Games."
  en:
    accent: [255, 79, 163]
    subs: false               # subtítulos quemados en el video (true para activarlos)
    youtube: true
    tiktok: false
    instagram: false
    uploadpost_user: sixstar-en
    hashtags: "#gta6 #fyp #viral"
    disclaimer: "Fan page. Not affiliated with Rockstar Games."

limits:
  per_run_per_lang: 1         # clips por idioma por corrida (2 si hay un momento muy fuerte)
  youtube_per_day: 12         # tope diario por canal de YouTube
  tiktok_per_day: 12          # tope diario por cuenta de TikTok (TikTok permite 15)
  instagram_per_day: 12
  min_minutes_between_posts: 25

# Streamers que el bot sigue. SOLO se usan estos (clips, picos de chat y grabación en vivo),
# y cada uno va al canal de su lista sin importar la etiqueta de idioma de Twitch.
# Agrega o quita nombres de usuario de Twitch (en minúscula). Lista vacía = cualquiera.
